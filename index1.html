<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudMetrics - Métricas en Tiempo Real</title>
    <!-- Conexión Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

    <div class="container my-5 text-center">
        <!-- Logo / Marca -->
        <div class="mb-4">
            <h4 class="fw-bold text-teal d-inline-flex align-items-center gap-2" style="color: #20c997;">
                <span class="rounded-circle bg-light p-2 d-inline-block">☁️</span> CloudMetrics
            </h4>
        </div>

        <!-- Enlaces de Navegación -->
        <nav class="nav justify-content-center mb-5">
            <a class="nav-link text-secondary fw-semibold" href="#">Inicio</a>
            <a class="nav-link text-secondary" href="#">Precios</a>
        </nav>

        <!-- Banner Principal -->
        <main class="my-4">
            <h1 class="display-5 fw-bold text-dark mb-3">
                Métricas en Tiempo Real para tu Negocio
            </h1>
            <p class="lead text-muted mx-auto mb-4" style="max-width: 650px;">
                Monitorea la salud de tus servidores con métricas precisas y alertas instantáneas.
            </p>
            
            <button type="button" class="btn btn-outline-success btn-lg px-4 fs-6">
                Probar Gratis
            </button>
        </main>

        <!-- Indicador Estadístico -->
        <section class="mt-5 pt-4">
            <h2 class="display-3 fw-bold text-info mb-0" style="color: #0dcaf0;">
                99.99%
            </h2>
            <p class="text-uppercase fw-semibold text-secondary small tracking-wider mt-1">
                Uptime Garantizado
            </p>
        </section>
    </div>

    <!-- Script Bootstrap CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
